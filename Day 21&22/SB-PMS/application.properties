pms.findid.success = "SUCCESS : Product Object Found"
pms.db.fail = "FAILED : DB Error"

pms.findAll.success = "SUCCESS : Product Objects Found"
pms.db.fail = "FAILED : DB Error"

#application error properties
pms.invalid.product-details = "FAILED : Invalid Product Details"
pms.invalid.product-notFound = "FAILED : Product Not Found



eureka.instance.hostname=localhost

#Stop registering as a client. It is a Server
eureka.client.register-with-eureka=true
